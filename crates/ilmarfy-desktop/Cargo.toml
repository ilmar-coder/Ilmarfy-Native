[package]
name = "ilmarfy-desktop"
description = "Ilmarfy para Mac e Linux (Fedora)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = { version = "0.37.0", features = ["all_loaders", "http"] }
egui_system_font_provider = "0.37"
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }
ilmarfy-core = { version = "0.1.0", path = "../ilmarfy-core" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav"] }
souvlaki = "0.9.3"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[[bin]]
name = "ilmarfy-desktop"
path = "src/main.rs"

# Pacote RPM (Fedora), gerado no GitHub Actions: .github/workflows/desktop-linux.yml
[package.metadata.generate-rpm]
name = "ilmarfy"
summary = "Ilmarfy: player de música da Private Cloud"
license = "Proprietary"
assets = [
    { source = "target/release/ilmarfy-desktop", dest = "/usr/bin/ilmarfy", mode = "755" },
    { source = "packaging/ilmarfy.desktop", dest = "/usr/share/applications/ilmarfy.desktop", mode = "644" },
    { source = "packaging/ilmarfy-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/ilmarfy.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
alsa-lib = "*"
dbus-libs = "*"
fontconfig = "*"
libxkbcommon = "*"
